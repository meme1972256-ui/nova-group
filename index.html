<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>محفظة أمان - تسجيل الدخول</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Tahoma, sans-serif;
            background: #fff;
            color: #171717;
        }

        .container {
            min-height: 100vh;
            display: flex;
        }

        /* =========================
           قسم تسجيل الدخول
        ========================= */

        .login-section {
            width: 50%;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 70px;
            border-left: 1px solid #ddd;
        }

        .login-box {
            width: 100%;
            max-width: 620px;
            text-align: center;
        }

        .title {
            font-size: 24px;
            margin-bottom: 30px;
            font-weight: bold;
        }

        .input {
            width: 100%;
            height: 78px;
            border: 1px solid #ddd;
            border-radius: 20px;
            margin-bottom: 15px;
            padding: 0 25px;
            font-size: 17px;
            outline: none;
            text-align: right;
        }

        .input:focus {
            border-color: #80aef0;
            box-shadow: 0 0 0 3px rgba(37, 119, 232, 0.08);
        }

        .login-btn {
            width: 100%;
            height: 62px;
            border: none;
            border-radius: 18px;
            background: #8eb9ed;
            color: white;
            font-size: 18px;
            cursor: pointer;
            margin-top: 5px;
        }

        .login-btn:hover {
            background: #6da4e8;
        }

        .forgot {
            display: block;
            color: #222;
            text-decoration: none;
            margin: 28px 0;
            font-size: 17px;
        }

        .forgot:hover {
            text-decoration: underline;
        }

        .or {
            display: flex;
            align-items: center;
            gap: 15px;
            color: #999;
            margin: 20px 0;
        }

        .or::before,
        .or::after {
            content: "";
            height: 1px;
            background: #eee;
            flex: 1;
        }

        .demo-btn {
            width: 100%;
            height: 60px;
            border: none;
            border-radius: 18px;
            background: #f3f4f6;
            color: #333;
            font-size: 17px;
            cursor: pointer;
            margin-bottom: 15px;
        }

        .demo-btn:hover {
            background: #e8e9eb;
        }

        .create-btn {
            width: 100%;
            height: 60px;
            border: 1.5px solid #2477e8;
            border-radius: 18px;
            background: white;
            color: #2477e8;
            font-size: 17px;
            cursor: pointer;
        }

        .create-btn:hover {
            background: #f5f9ff;
        }

        .message {
            margin-top: 20px;
            min-height: 25px;
            color: #2477e8;
            font-size: 15px;
        }

        .footer {
            margin-top: 30px;
            color: #666;
            font-size: 17px;
        }

        .security-icon {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 25px;
            height: 25px;
            border-radius: 50%;
            background: #2477e8;
            color: white;
            margin-left: 6px;
        }


        /* =========================
           القسم الجانبي
        ========================= */

        .hero-section {
            width: 50%;
            min-height: 100vh;
            background: linear-gradient(
                135deg,
                #ffffff,
                #edf6ff
            );

            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            overflow: hidden;
        }

        .hero-content {
            max-width: 650px;
        }

        .logo {
            width: 90px;
            height: 90px;
            margin: 0 auto 30px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 25px;

            background: linear-gradient(
                145deg,
                #1469dc,
                #51adff
            );

            color: white;
            font-size: 48px;
            font-weight: bold;

            box-shadow: 0 12px 30px rgba(36, 119, 232, 0.22);
        }

        .brand-name {
            font-size: 25px;
            font-weight: bold;
            margin-bottom: 40px;
        }

        .hero-title {
            font-size: 46px;
            line-height: 1.5;
            margin: 0;
        }

        .hero-title span {
            color: #e85d69;
        }

        .hero-text {
            font-size: 20px;
            line-height: 1.9;
            color: #666;
            margin-top: 20px;
        }


        /* =========================
           صورة المحفظة
        ========================= */

        .wallet {
            position: relative;
            width: 400px;
            height: 250px;
            margin: 35px auto 0;
        }

        .card {
            position: absolute;
            width: 300px;
            height: 185px;
            border-radius: 22px;
            box-shadow: 0 18px 40px rgba(20, 90, 160, 0.18);
        }

        .back-card {
            right: 20px;
            top: 25px;

            background: linear-gradient(
                135deg,
                #d8ebff,
                #a8d1ff
            );

            transform: rotate(-8deg);
        }

        .front-card {
            left: 35px;
            top: 45px;

            background: linear-gradient(
                135deg,
                #176ce0,
                #59b4ff
            );

            transform: rotate(5deg);
            color: white;
            padding: 25px;
            text-align: left;
            direction: ltr;
        }

        .chip {
            width: 42px;
            height: 31px;
            border-radius: 7px;
            background: #f0ca6b;
            margin-bottom: 20px;
        }

        .card-title {
            position: absolute;
            right: 23px;
            top: 25px;
            font-size: 18px;
            font-weight: bold;
        }

        .card-number {
            margin-top: 30px;
            font-size: 15px;
            letter-spacing: 2px;
        }

        .card-bottom {
            position: absolute;
            bottom: 20px;
            left: 25px;
            right: 25px;

            display: flex;
            justify-content: space-between;

            font-size: 13px;
        }

        .check {
            position: absolute;

            right: 5px;
            bottom: 20px;

            width: 58px;
            height: 58px;

            display: flex;
            justify-content: center;
            align-items: center;

            border-radius: 50%;

            background: #22c76f;
            color: white;

            border: 5px solid white;

            font-size: 28px;
            font-weight: bold;

            box-shadow: 0 8px 20px rgba(0,0,0,0.15);
        }


        /* =========================
           الهاتف
        ========================= */

        @media (max-width: 900px) {

            .container {
                flex-direction: column;
            }

            .hero-section {
                width: 100%;
                min-height: 430px;
                padding: 30px 20px;
            }

            .login-section {
                width: 100%;
                min-height: auto;
                padding: 40px 20px;
                border: none;
            }

            .hero-title {
                font-size: 32px;
            }

            .hero-text {
                font-size: 16px;
            }

            .wallet {
                transform: scale(0.78);
                margin-top: 0;
            }

            .logo {
                width: 65px;
                height: 65px;
                font-size: 35px;
                border-radius: 18px;
                margin-bottom: 15px;
            }

            .brand-name {
                font-size: 22px;
                margin-bottom: 20px;
            }

            .title {
                font-size: 21px;
            }

            .input {
                height: 65px;
                font-size: 15px;
                border-radius: 16px;
            }

            .login-btn,
            .demo-btn,
            .create-btn {
                height: 58px;
                border-radius: 16px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <!-- =========================
         تسجيل الدخول
    ========================== -->

    <section class="login-section">

        <div class="login-box">

            <div class="title">
                تسجيل الدخول إلى محفظة أمان
            </div>

            <form id="loginForm">

                <input
                    id="username"
                    class="input"
                    type="text"
                    placeholder="رقم الهاتف أو اسم المستخدم أو البريد الإلكتروني"
                    required
                >

                <input
                    id="password"
                    class="input"
                    type="password"
                    placeholder="كلمة السر"
                    required
                >

                <button
                    class="login-btn"
                    type="submit"
                >
                    تسجيل الدخول
                </button>

            </form>

            <a href="#" class="forgot" id="forgot">
                هل نسيت كلمة السر؟
            </a>

            <div class="or">
                أو
            </div>

            <button
                class="demo-btn"
                id="demo"
            >
                الدخول التجريبي
            </button>

            <button
                class="create-btn"
                id="create"
            >
                إنشاء حساب جديد
            </button>

            <div
                class="message"
                id="message"
            ></div>

            <div class="footer">
                <span class="security-icon">✓</span>
                محفظة أمان
            </div>

        </div>

    </section>


    <!-- =========================
         القسم الجانبي
    ========================== -->

    <section class="hero-section">

        <div class="hero-content">

            <div class="logo">
                أ
            </div>

            <div class="brand-name">
                محفظة أمان
            </div>

            <h1 class="hero-title">
                احمِ أموالك<br>
                وأدر محفظتك
                <span>بأمان.</span>
            </h1>

            <p class="hero-text">
                خدمات مالية رقمية بسيطة وسريعة
                <br>
                مع حماية بياناتك وخصوصيتك.
            </p>


            <div class="wallet">

                <div class="card back-card"></div>

                <div class="card front-card">

                    <div class="chip"></div>

                    <div class="card-title">
                        أمان
                    </div>

                    <div class="card-number">
                        •••• •••• •••• 2026
                    </div>

                    <div class="card-bottom">
                        <span>محفظة أمان</span>
                        <span>آمنة</span>
                    </div>

                </div>

                <div class="check">
                    ✓
                </div>

            </div>

        </div>

    </section>

</div>


<script>

    const form = document.getElementById("loginForm");
    const message = document.getElementById("message");

    form.addEventListener("submit", function(event) {

        event.preventDefault();

        message.textContent =
            "هذا نموذج تجريبي — لم يتم إرسال أو حفظ كلمة المرور.";

    });


    document.getElementById("demo").onclick = function() {

        message.textContent =
            "تم تشغيل وضع الدخول التجريبي.";

    };


    document.getElementById("create").onclick = function() {

        message.textContent =
            "يمكن ربط هذا الزر بصفحة إنشاء حساب.";

    };


    document.getElementById("forgot").onclick = function(event) {

        event.preventDefault();

        message.textContent =
            "يمكن إضافة صفحة استعادة كلمة المرور هنا.";

    };

</script>

</body>
</html>
