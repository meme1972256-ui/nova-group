<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: white;
            font-family: Arial, sans-serif;
        }

        .page {
            width: 100%;
            min-height: 100vh;
            padding: 35px;
        }

        /* العربية */
        .language {
            text-align: center;
            color: #777;
            font-size: 24px;
            margin-bottom: 150px;
        }

        /* الشعار */
        .logo {
            width: 125px;
            height: 125px;
            display: block;
            margin: 0 auto 180px;
        }

        /* الخانات */
        input {
            width: 100%;
            height: 135px;
            border: 1px solid #ddd;
            border-radius: 35px;
            padding: 0 30px;
            font-size: 24px;
            text-align: right;
            margin-bottom: 25px;
            outline: none;
        }

        /* زر الدخول */
        .login {
            width: 100%;
            height: 95px;
            border: none;
            border-radius: 50px;
            background: #0877e8;
            color: white;
            font-size: 28px;
            cursor: pointer;
        }

        /* نسيت كلمة السر */
        .forgot {
            text-align: center;
            font-size: 23px;
            margin-top: 45px;
        }

        /* إنشاء حساب */
        .create {
            width: 100%;
            height: 90px;
            border: 2px solid #0877e8;
            border-radius: 50px;
            background: white;
            color: #0877e8;
            font-size: 27px;
            margin-top: 330px;
        }

        /* Meta */
        .meta {
            text-align: center;
            margin-top: 35px;
            font-size: 30px;
            color: #303846;
        }
    </style>
</head>

<body>

<div class="page">

    <div class="language">العربية</div>

    <!-- شعار Instagram -->
    <svg class="logo"
         viewBox="0 0 120 120"
         xmlns="http://www.w3.org/2000/svg">

        <defs>
            <linearGradient id="ig" x1="0%" y1="100%" x2="100%" y2="0%">
                <stop offset="0%" stop-color="#FFD600"/>
                <stop offset="25%" stop-color="#FF7A00"/>
                <stop offset="50%" stop-color="#FF0069"/>
                <stop offset="75%" stop-color="#D300C5"/>
                <stop offset="100%" stop-color="#7638FA"/>
            </linearGradient>
        </defs>

        <rect x="15" y="15"
              width="90"
              height="90"
              rx="25"
              fill="none"
              stroke="url(#ig)"
              stroke-width="9"/>

        <circle cx="60" cy="60"
                r="22"
                fill="none"
                stroke="url(#ig)"
                stroke-width="9"/>

        <circle cx="86"
                cy="34"
                r="6"
                fill="url(#ig)"/>
    </svg>

    <input
        type="text"
        placeholder="اسم المستخدم أو البريد الإلكتروني أو رقم الهاتف المحمول">

    <input
        type="password"
        placeholder="كلمة السر">

    <button class="login">
        تسجيل الدخول
    </button>

    <div class="forgot">
        هل نسيت كلمة السر؟
    </div>

    <button class="create">
        إنشاء حساب جديد
    </button>

    <div class="meta">
        <b>∞ Meta</b>
    </div>

</div>

</body>
</html>
