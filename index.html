<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل الدخول</title>

<style>
*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body{
    background:#fff;
    font-family:Arial,sans-serif;
    position:fixed;
    inset:0;
    touch-action:none;
}

.page{
    width:100%;
    height:100vh;
    height:100dvh;
    padding:12px 34px;
    overflow:hidden;
}

/* العربية */
.language{
    text-align:center;
    color:#777;
    font-size:15px;
    margin-bottom:120px;
}

/* الشعار */
.logo{
    width:75px;
    height:75px;
    display:block;
    margin:0 auto 170px;
}

/* الحقول */
input{
    width:100%;
    height:55px;
    border:1px solid #ddd;
    border-radius:22px;
    padding:0 16px;
    font-size:15px;
    text-align:right;
    margin-bottom:12px;
    outline:none;
    background:#fff;
}

input:focus{
    border-color:#aaa;
}

/* تسجيل الدخول */
.login{
    width:100%;
    height:48px;
    border:0;
    border-radius:25px;
    background:#0877e8;
    color:white;
    font-size:17px;
    cursor:pointer;
}

.login:active{
    opacity:.8;
}

/* نسيت كلمة السر */
.forgot{
    text-align:center;
    font-size:15px;
    margin-top:25px;
    cursor:pointer;
}

/* إنشاء حساب */
.create{
    width:100%;
    height:48px;
    border:1px solid #0877e8;
    border-radius:25px;
    background:white;
    color:#0877e8;
    font-size:17px;
    margin-top:280px;
    cursor:pointer;
}

.create:active{
    opacity:.8;
}

/* الرسائل */
.message{
    display:none;
    text-align:center;
    margin-top:15px;
    font-size:14px;
}

/* Meta */
.meta{
    text-align:center;
    margin-top:20px;
    font-size:18px;
    color:#303846;
}

.meta-logo{
    color:#0877e8;
    font-size:23px;
    font-weight:bold;
}
</style>
</head>

<body>

<div class="page">

    <div class="language">
        العربية
    </div>

    <!-- الشعار -->
    <svg class="logo" viewBox="0 0 120 120">

        <defs>
            <linearGradient id="ig"
                x1="0%" y1="100%"
                x2="100%" y2="0%">

                <stop offset="0%" stop-color="#FFD600"/>
                <stop offset="25%" stop-color="#FF7A00"/>
                <stop offset="50%" stop-color="#FF0069"/>
                <stop offset="75%" stop-color="#D300C5"/>
                <stop offset="100%" stop-color="#7638FA"/>

            </linearGradient>
        </defs>

        <rect x="15" y="15"
              width="90" height="90"
              rx="25"
              fill="none"
              stroke="url(#ig)"
              stroke-width="9"/>

        <circle cx="60" cy="60"
                r="22"
                fill="none"
                stroke="url(#ig)"
                stroke-width="9"/>

        <circle cx="86" cy="34"
                r="6"
                fill="url(#ig)"/>

    </svg>


    <input
        id="username"
        type="text"
        placeholder="اسم المستخدم أو البريد الإلكتروني أو رقم الهاتف المحمول">


    <input
        id="password"
        type="password"
        placeholder="كلمة السر">


    <button class="login" onclick="login()">
        تسجيل الدخول
    </button>


    <div class="forgot" onclick="forgotPassword()">
        هل نسيت كلمة السر؟
    </div>


    <div id="message" class="message"></div>


    <button class="create" onclick="createAccount()">
        إنشاء حساب جديد
    </button>


    <div class="meta">
        <span class="meta-logo">∞</span> Meta
    </div>

</div>


<script>

function login(){

    const username =
        document.getElementById("username").value.trim();

    const password =
        document.getElementById("password").value.trim();

    const message =
        document.getElementById("message");


    if(username === ""){

        message.style.display = "block";

        message.textContent =
            "اكتب اسم المستخدم أو البريد الإلكتروني";

        return;
    }


    if(password === ""){

        message.style.display = "block";

        message.textContent =
            "اكتب كلمة السر";

        return;
    }


    message.style.display = "block";

    message.textContent =
        "جاري تسجيل الدخول...";

}


function forgotPassword(){

    const message =
        document.getElementById("message");

    message.style.display = "block";

    message.textContent =
        "سيتم فتح صفحة استعادة كلمة السر";

}


function createAccount(){

    window.location.href =
        "signup.html";

}

</script>

</body>
</html>
